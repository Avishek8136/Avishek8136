<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" id="metaDescription" content="Blog post by Avishek Rauniyar">
    <meta name="author" content="Avishek Rauniyar">
    <meta name="keywords" id="metaKeywords" content="AI, Machine Learning, Cloud Computing">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" id="ogUrl" content="">
    <meta property="og:title" id="ogTitle" content="">
    <meta property="og:description" id="ogDescription" content="">
    <meta property="og:image" content="https://avishekrauniyar.com.np/assets/imgs/avatar.webp">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" id="twitterUrl" content="">
    <meta property="twitter:title" id="twitterTitle" content="">
    <meta property="twitter:description" id="twitterDescription" content="">
    <meta property="twitter:image" content="https://avishekrauniyar.com.np/assets/imgs/avatar.webp">
    
    <title id="pageTitle">Blog Post - Avishek Rauniyar</title>
    <link rel="canonical" id="canonicalUrl" href="">
    <link rel="stylesheet" href="assets/vendors/themify-icons/css/themify-icons.css">
    <link rel="stylesheet" href="assets/css/avishek.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json" id="structuredData"></script>
    
    <style>
        .blog-post-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 80px 0 60px;
            color: white;
        }
        .blog-post-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .blog-post-title {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.3;
        }
        .blog-post-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 16px;
            opacity: 0.9;
        }
        .blog-post-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .blog-post-content {
            background: white;
            padding: 60px 20px;
        }
        .blog-content {
            font-size: 18px;
            line-height: 1.8;
            color: #333;
        }
        .blog-content p {
            margin-bottom: 20px;
        }
        .blog-content h2 {
            margin-top: 40px;
            margin-bottom: 20px;
            color: #333;
            font-weight: 700;
        }
        .blog-content h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            color: #444;
            font-weight: 600;
        }
        .blog-content ul, .blog-content ol {
            margin-bottom: 20px;
            padding-left: 30px;
        }
        .blog-content li {
            margin-bottom: 10px;
        }
        .blog-content code {
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        .blog-content pre {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .blog-tags-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #eee;
        }
        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .blog-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .blog-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .back-navigation {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .back-button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .share-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #eee;
        }
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        .share-button:hover {
            transform: translateY(-2px);
            color: white;
        }
        .share-twitter {
            background: #1da1f2;
        }
        .share-linkedin {
            background: #0077b5;
        }
        .share-facebook {
            background: #1877f2;
        }
        .not-found {
            text-align: center;
            padding: 100px 20px;
        }
        .not-found i {
            font-size: 80px;
            color: #ddd;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="blogPost">
        <div class="blog-post-header">
            <div class="blog-post-container">
                <h1 class="blog-post-title" id="blogTitle"></h1>
                <div class="blog-post-meta">
                    <span><i class="ti-user"></i> Avishek Rauniyar</span>
                    <span><i class="ti-calendar"></i> <span id="blogDate"></span></span>
                </div>
            </div>
        </div>

        <div class="blog-post-content">
            <div class="blog-post-container">
                <div class="blog-content" id="blogContent"></div>

                <div class="blog-tags-section">
                    <h3>Tags</h3>
                    <div class="blog-tags" id="blogTags"></div>
                </div>

                <div class="share-section">
                    <h3>Share this post</h3>
                    <div class="share-buttons">
                        <a href="#" class="share-button share-twitter" id="shareTwitter" target="_blank">
                            <i class="ti-twitter"></i> Twitter
                        </a>
                        <a href="#" class="share-button share-linkedin" id="shareLinkedIn" target="_blank">
                            <i class="ti-linkedin"></i> LinkedIn
                        </a>
                        <a href="#" class="share-button share-facebook" id="shareFacebook" target="_blank">
                            <i class="ti-facebook"></i> Facebook
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="back-navigation">
            <a href="blogs.html" class="back-button"><i class="ti-arrow-left"></i> Back to All Blogs</a>
        </div>
    </div>

    <div id="notFound" class="not-found" style="display: none;">
        <i class="ti-alert"></i>
        <h2>Blog Post Not Found</h2>
        <p>The blog post you're looking for doesn't exist.</p>
        <br>
        <a href="blogs.html" class="back-button">View All Blogs</a>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function formatContent(content) {
            // Simple markdown-like formatting
            let formatted = content
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            
            return '<p>' + formatted + '</p>';
        }

        function loadBlogPost() {
            const slug = getQueryParam('slug');
            
            if (!slug) {
                showNotFound();
                return;
            }

            const blogs = JSON.parse(localStorage.getItem('blogs') || '[]');
            const blog = blogs.find(b => b.slug === slug);

            if (!blog) {
                showNotFound();
                return;
            }

            // Update page content
            document.getElementById('blogTitle').textContent = blog.title;
            document.getElementById('blogDate').textContent = new Date(blog.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('blogContent').innerHTML = formatContent(blog.content);

            // Display tags
            if (blog.tags) {
                const tags = blog.tags.split(',').map(t => t.trim());
                document.getElementById('blogTags').innerHTML = tags.map(tag => 
                    `<span class="blog-tag">${tag}</span>`
                ).join('');
            }

            // Update meta tags
            const pageUrl = `https://avishekrauniyar.com.np/blog-post.html?slug=${slug}`;
            const excerpt = blog.content.substring(0, 160);
            
            document.getElementById('pageTitle').textContent = `${blog.title} - Avishek Rauniyar`;
            document.getElementById('metaDescription').setAttribute('content', excerpt);
            document.getElementById('metaKeywords').setAttribute('content', blog.tags || 'AI, Machine Learning');
            document.getElementById('canonicalUrl').setAttribute('href', pageUrl);
            
            // Open Graph
            document.getElementById('ogUrl').setAttribute('content', pageUrl);
            document.getElementById('ogTitle').setAttribute('content', blog.title);
            document.getElementById('ogDescription').setAttribute('content', excerpt);
            
            // Twitter
            document.getElementById('twitterUrl').setAttribute('content', pageUrl);
            document.getElementById('twitterTitle').setAttribute('content', blog.title);
            document.getElementById('twitterDescription').setAttribute('content', excerpt);

            // Structured Data
            const structuredData = {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": blog.title,
                "datePublished": blog.date,
                "author": {
                    "@type": "Person",
                    "name": "Avishek Rauniyar",
                    "url": "https://avishekrauniyar.com.np"
                },
                "description": excerpt,
                "url": pageUrl
            };
            document.getElementById('structuredData').textContent = JSON.stringify(structuredData);

            // Share buttons
            const shareText = encodeURIComponent(blog.title);
            const shareUrl = encodeURIComponent(pageUrl);
            
            document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}`;
            document.getElementById('shareLinkedIn').href = `https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}`;
            document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`;
        }

        function showNotFound() {
            document.getElementById('blogPost').style.display = 'none';
            document.getElementById('notFound').style.display = 'block';
        }

        // Load blog post on page load
        loadBlogPost();
    </script>
    
    <!-- Theme Manager -->
    <script src="assets/js/theme-manager.js"></script>
</body>
</html>
